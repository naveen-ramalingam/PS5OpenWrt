# dnsmasq configuration snippet for PS5 isolation
# Can be placed in /etc/dnsmasq.d/ps5.conf or appended to /etc/config/dhcp

# 1. Static Host Mapping (Replace with your actual MACs and desired IP)
# dhcp-host=c0:15:1b:xx:xx:xx,90:47:48:xx:xx:xx,192.168.1.100,PS5,set:ps5_client

# Note on dnsmasq domain filtering:
# Standard dnsmasq applies address=/domain/0.0.0.0 globally.
# If you run dnsmasq without AdGuard Home, you can either:
# a) Apply these globally if your home router only serves your gaming setup:
# address=/playstation.com/0.0.0.0
# address=/playstation.net/0.0.0.0
# address=/psndl.net/0.0.0.0
# address=/youtube.com/0.0.0.0
# address=/googlevideo.com/0.0.0.0
# address=/youtu.be/0.0.0.0
# address=/ytimg.com/0.0.0.0
#
# Whitelist bypass in dnsmasq (routes to upstream DNS):
# server=/feature.api.playstation.com/#
# server=/stun.playstation.net/#
# server=/ena.net.playstation.net/#
# server=/post.net.playstation.net/#
# server=/gst.prod.dl.playstation.net/#
#
# b) Or use nftset tagging in dnsmasq with OpenWrt fw4 to redirect only the PS5.
# For client-specific selective blocking without affecting other home devices,
# AdGuard Home (which supports $client=<IP>) is strongly recommended.
