# ==============================================================================
# OpenWrt Static DHCP Host Lease Configuration Template
# ==============================================================================
# Binds both the PS5 Ethernet and Wi-Fi MAC addresses to the same static IP
# (e.g., 192.168.1.100), ensuring DNS and firewall policies apply seamlessly
# regardless of whether the console is connected via cable or Wi-Fi.
#
# Replace:
#   <PS5_NAME>      -> e.g., PS5
#   <PS5_WIRED_MAC> -> e.g., c0:15:1b:00:11:22
#   <PS5_WIFI_MAC>  -> e.g., 90:47:48:00:11:22
#   <PS5_STATIC_IP> -> e.g., 192.168.1.100
# ==============================================================================

uci add dhcp host
uci set dhcp.@host[-1].name='<PS5_NAME>'
uci add_list dhcp.@host[-1].mac='<PS5_WIRED_MAC>'
uci add_list dhcp.@host[-1].mac='<PS5_WIFI_MAC>'
uci set dhcp.@host[-1].ip='<PS5_STATIC_IP>'

uci commit dhcp
/etc/init.d/dnsmasq reload
