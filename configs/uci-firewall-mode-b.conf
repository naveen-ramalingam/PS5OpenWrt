# ==============================================================================
# OpenWrt Mode B: Dedicated Switch Port & Isolated Subnet (e.g. lan4)
# ==============================================================================
# Removes a physical port (e.g., lan4) from br-lan and assigns it a dedicated
# IPv4-only subnet (e.g., 192.168.4.1/24, PS5 at 192.168.4.100).
# Zero IPv6 packets or Router Advertisements ever touch this port.
#
# Replace:
#   <LAN_PORT>  -> e.g., lan4
#   <SUBNET_IP> -> e.g., 192.168.4.1
#   <NETMASK>   -> e.g., 255.255.255.0
# ==============================================================================

# 1. Remove port from main bridge br-lan
uci del_list network.@device[0].ports='<LAN_PORT>'

# 2. Define dedicated network interface
uci set network.ps5lan=interface
uci set network.ps5lan.device='<LAN_PORT>'
uci set network.ps5lan.proto='static'
uci set network.ps5lan.ipaddr='<SUBNET_IP>'
uci set network.ps5lan.netmask='<NETMASK>'
uci set network.ps5lan.ipv6='0'

# 3. Configure dedicated IPv4-only DHCP pool
uci set dhcp.ps5lan=dhcp
uci set dhcp.ps5lan.interface='ps5lan'
uci set dhcp.ps5lan.start='100'
uci set dhcp.ps5lan.limit='50'
uci set dhcp.ps5lan.leasetime='12h'
uci set dhcp.ps5lan.dhcpv4='server'
uci set dhcp.ps5lan.dhcpv6='disabled'
uci set dhcp.ps5lan.ra='disabled'
uci set dhcp.ps5lan.ndp='disabled'

# 4. Attach ps5lan to lan firewall zone (allows LAN PC to communicate with PS5)
uci add_list firewall.@zone[0].network='ps5lan'

uci commit network
uci commit dhcp
uci commit firewall
/etc/init.d/network reload
/etc/init.d/firewall reload
