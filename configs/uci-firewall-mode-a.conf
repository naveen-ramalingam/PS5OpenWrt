# ==============================================================================
# OpenWrt Mode A: Bridged LAN with MAC-Level PS5 Protection (Recommended)
# ==============================================================================
# Keeps the PS5 on the same subnet (e.g., 192.168.1.0/24) as your PC/phone for
# easy FTP/payload delivery, while strictly isolating it via layer-3 firewall rules.
#
# Replace:
#   <PS5_WIRED_MAC> -> e.g., c0:15:1b:00:11:22
#   <PS5_WIFI_MAC>  -> e.g., 90:47:48:00:11:22
#   <ROUTER_IP>     -> e.g., 192.168.1.1
# ==============================================================================

# 1. Force PS5 IPv4 DNS queries to local AdGuard Home (prevents manual DNS bypass)
uci add firewall redirect
uci set firewall.@redirect[-1].name='Redirect-PS5-DNS-to-AdGuard'
uci set firewall.@redirect[-1].src='lan'
uci set firewall.@redirect[-1].proto='tcp udp'
uci set firewall.@redirect[-1].src_dport='53'
uci set firewall.@redirect[-1].dest_ip='<ROUTER_IP>'
uci set firewall.@redirect[-1].dest_port='53'
uci set firewall.@redirect[-1].target='DNAT'
uci set firewall.@redirect[-1].family='ipv4'
uci add_list firewall.@redirect[-1].src_mac='<PS5_WIRED_MAC>'
uci add_list firewall.@redirect[-1].src_mac='<PS5_WIFI_MAC>'

# 2. Block outbound DNS-over-TLS (port 853) to prevent encrypted DNS leaks
uci add firewall rule
uci set firewall.@rule[-1].name='Block-PS5-DoT'
uci set firewall.@rule[-1].src='lan'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].dest_port='853'
uci set firewall.@rule[-1].target='REJECT'
uci add_list firewall.@rule[-1].src_mac='<PS5_WIRED_MAC>'
uci add_list firewall.@rule[-1].src_mac='<PS5_WIFI_MAC>'

# 3. Reject PS5 IPv6 input to the router (stops SLAAC privacy address DNS bypass)
uci set firewall.ps5_ipv6_in=rule
uci set firewall.ps5_ipv6_in.name='Block-PS5-IPv6-Input'
uci set firewall.ps5_ipv6_in.src='lan'
uci set firewall.ps5_ipv6_in.family='ipv6'
uci set firewall.ps5_ipv6_in.proto='tcp udp'
uci add_list firewall.ps5_ipv6_in.src_mac='<PS5_WIRED_MAC>'
uci add_list firewall.ps5_ipv6_in.src_mac='<PS5_WIFI_MAC>'
uci set firewall.ps5_ipv6_in.target='REJECT'

# 4. Reject PS5 IPv6 forward to the Internet (stops outbound IPv6 connections)
uci set firewall.ps5_ipv6_fwd=rule
uci set firewall.ps5_ipv6_fwd.name='Block-PS5-IPv6-Forward'
uci set firewall.ps5_ipv6_fwd.src='lan'
uci set firewall.ps5_ipv6_fwd.dest='*'
uci set firewall.ps5_ipv6_fwd.family='ipv6'
uci set firewall.ps5_ipv6_fwd.proto='all'
uci add_list firewall.ps5_ipv6_fwd.src_mac='<PS5_WIRED_MAC>'
uci add_list firewall.ps5_ipv6_fwd.src_mac='<PS5_WIFI_MAC>'
uci set firewall.ps5_ipv6_fwd.target='REJECT'

uci commit firewall
/etc/init.d/firewall reload
